name: CI

# Build and test the workspace on every PR and on pushes to the default branch.
# This is the gate that catches a publish sync dropping a file the crates depend
# on: if the sanitized snapshot no longer builds, the sync PR goes red and
# cannot merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      # Let every OS leg finish so a probe run reports all platforms' failures,
      # not just the first to break.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Full debug info fills the runner's disk before the doctests link.
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # Use first-party actions; install the Rust toolchain through rustup.
      # persist-credentials: false — token isn't used after checkout.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Install the toolchain via rustup (preinstalled on GitHub runners) rather
      # than a third-party action. edition 2024 needs a recent stable.
      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      # Cache only content-addressed download dirs, not target/ (poisoning vector).
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      # dogwood-server is Linux-only. It compiles on any Unix (it uses Unix
      # domain sockets), but its control-plane trust boundary attests the peer's
      # credentials via SO_PEERCRED, which is implemented only for Linux; on
      # macOS peer attestation fails closed, so the server is non-functional and
      # its tests cannot pass there. On Windows it does not even compile
      # (std::os::unix has no Windows equivalent). dogwood-performance depends on
      # dogwood-server and is excluded for the same reason. Only Linux builds and
      # tests the full workspace; macOS and Windows cover the portable engine
      # (dogwood-local-engine). Supporting the server off Linux would need macOS
      # getpeereid/LOCAL_PEERCRED attestation and a Windows named-pipe transport,
      # each a separate, security-sensitive change.
      - name: Build (Linux — full workspace)
        if: runner.os == 'Linux'
        run: cargo build --workspace --all-targets

      - name: Test (Linux — full workspace)
        if: runner.os == 'Linux'
        run: cargo test --workspace

      - name: Build (macOS/Windows — exclude Linux-only crates)
        if: runner.os != 'Linux'
        run: cargo build --workspace --all-targets --exclude dogwood-server --exclude dogwood-performance

      - name: Test (macOS/Windows — exclude Linux-only crates)
        if: runner.os != 'Linux'
        run: cargo test --workspace --exclude dogwood-server --exclude dogwood-performance

      - name: Disk usage (Unix)
        # df/du are Unix-only; the Windows equivalent is a separate step below.
        if: always() && runner.os != 'Windows'
        run: df -h / && du -sh target

      - name: Disk usage (Windows)
        # PowerShell equivalent of `df -h /` (drive free/used) and `du -sh target`
        # (recursive size of the build dir). `target` may not exist if the build
        # step failed early, so guard it.
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
          if (Test-Path target) {
            $bytes = (Get-ChildItem target -Recurse -File -ErrorAction SilentlyContinue |
              Measure-Object -Property Length -Sum).Sum
            "target: {0:N2} GB" -f ($bytes / 1GB)
          } else {
            "target: (absent)"
          }

name: CI

# Build and test the workspace on every PR and on pushes to the default branch.
# This is the gate that catches a publish sync dropping a file the crates depend
# on: if the sanitized snapshot no longer builds, the sync PR goes red and
# cannot merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      # Let every OS leg finish so a probe run reports all platforms' failures,
      # not just the first to break.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Full debug info fills the runner's disk before the doctests link.
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # Use first-party actions; install the Rust toolchain through rustup.
      # persist-credentials: false — token isn't used after checkout.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Install the toolchain via rustup (preinstalled on GitHub runners) rather
      # than a third-party action. edition 2024 needs a recent stable.
      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      # Cache only content-addressed download dirs, not target/ (poisoning vector).
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Build
        # Unix (ubuntu, macOS): build the whole workspace.
        if: runner.os != 'Windows'
        run: cargo build --workspace --all-targets

      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace

      # dogwood-server is Unix-specific: its transport and control-plane
      # security boundary are built on Unix domain sockets
      # (std::os::unix::net::UnixStream) and kernel peer credentials
      # (SO_PEERCRED), neither of which exists on Windows, so the crate cannot
      # compile there. dogwood-performance depends on dogwood-server and is
      # excluded for the same reason. The portable engine (dogwood-local-engine)
      # is still built and tested on Windows. To cover the server on Windows it
      # would need a Windows transport (e.g. named pipes) behind a #[cfg]; until
      # then it is Unix-only by design.
      - name: Build (Windows — exclude Unix-only crates)
        if: runner.os == 'Windows'
        run: cargo build --workspace --all-targets --exclude dogwood-server --exclude dogwood-performance

      - name: Test (Windows — exclude Unix-only crates)
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude dogwood-server --exclude dogwood-performance

      - name: Disk usage
        # df/du are Unix-only; skip on the Windows runner.
        if: always() && runner.os != 'Windows'
        run: df -h / && du -sh target
